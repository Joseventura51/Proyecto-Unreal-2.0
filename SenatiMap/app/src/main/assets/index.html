<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SENATI Map</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#eef3f7}#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:5;top:12px;left:12px;right:12px;background:#fffefcF2;border-radius:17px;padding:10px 12px;box-shadow:0 6px 24px #0003;display:flex;align-items:center;gap:10px}.brand{flex:1;min-width:0}.brand b{display:block;color:#00549f;font-size:18px}.brand small{display:block;color:#51606d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{border:0;border-radius:12px;min-height:42px;padding:0 12px;font-weight:700}.loc{background:#00549f;color:white}.panel{position:fixed;z-index:5;left:12px;right:12px;bottom:12px;background:#fffefcF2;border-radius:18px;padding:12px;box-shadow:0 6px 24px #0003}.row{display:grid;grid-template-columns:1fr auto;gap:8px}select,.route,.sim{height:44px;border-radius:12px;border:1px solid #d6dee6;font-weight:700}select{padding:0 9px;background:white}.route{background:#ffc72c;border:0;padding:0 18px}.sim{width:100%;margin-top:8px;background:#edf5fb;color:#06345e}.status{font-size:12px;color:#415465;margin-top:8px;line-height:1.35}.badge{position:fixed;right:12px;top:76px;z-index:4;background:#06345edb;color:white;padding:6px 9px;border-radius:10px;font-size:11px}.hint{position:fixed;left:50%;transform:translateX(-50%);top:84px;z-index:6;background:#ffc72c;padding:7px 11px;border-radius:12px;font-weight:700;font-size:12px;display:none}@media(max-width:430px){.brand small{display:none}.btn{font-size:12px;padding:0 9px}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div class="top"><div class="brand"><b>SENATI MAP</b><small>Sede Independencia · mapa QGIS offline</small></div><button class="btn loc" id="loc">Mi ubicación</button></div>
<div class="badge">QGIS · OFFLINE</div><div class="hint" id="hint">Toca el mapa para colocar tu ubicación</div>
<div class="panel"><div class="row"><select id="dest"></select><button class="route" id="route">Ruta</button></div><button class="sim" id="sim">Simular ubicación</button><div class="status" id="status">Cargando mapa…</div></div>
<script src="map_data.js"></script>
<script>
(()=>{'use strict';
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),destSel=document.getElementById('dest');
let W=0,H=0,dpr=1,scale=1,ox=0,oy=0,drag=false,last=null,sim=false,user={lon:-77.062488,lat:-11.9990266,demo:true},routePts=[];
const CAMPUS=[-77.0631,-12.0010,-77.0572,-11.9962];
function flatten(g){if(!g)return[];let c=g.coordinates;if(g.type==='Point')return[c];if(g.type==='LineString')return c;if(g.type==='Polygon')return c.flat();if(g.type==='MultiPolygon')return c.flat(2);return[]}
function project(lon,lat){const [a,b,c,d]=CAMPUS;const x=(lon-a)/(c-a),y=(d-lat)/(d-b);return{x:(x*W)*scale+ox,y:(y*H)*scale+oy}}
function unproject(x,y){const [a,b,c,d]=CAMPUS;const nx=((x-ox)/scale)/W,ny=((y-oy)/scale)/H;return{lon:a+nx*(c-a),lat:d-ny*(d-b)}}
function resize(){dpr=Math.max(1,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function pathGeom(g){const c=g.coordinates;if(g.type==='Point'){const p=project(c[0],c[1]);ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);return}
 const rings=g.type==='LineString'?[c]:g.type==='Polygon'?c:g.type==='MultiPolygon'?c.flat():[];ctx.beginPath();for(const ring of rings){ring.forEach((p,i)=>{const q=project(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});if(g.type!=='LineString')ctx.closePath()}}
function fillSet(arr,fill,stroke='#ffffff',lw=.7){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=lw;for(const f of arr){pathGeom(f.g);ctx.fill();ctx.stroke()}}
function lineSet(arr,color,width){ctx.strokeStyle=color;ctx.lineCap='round';for(const f of arr){const h=f.p.highway||'';ctx.lineWidth=(h==='footway'||h==='pedestrian')?Math.max(1.6,width):Math.max(1,width*.75);pathGeom(f.g);ctx.stroke()}}
function center(f){const pts=flatten(f.g);if(!pts.length)return null;let x=0,y=0;for(const p of pts){x+=p[0];y+=p[1]}return[x/pts.length,y/pts.length]}
function labelSet(arr){ctx.font='600 10px Arial';ctx.textAlign='center';ctx.textBaseline='middle';for(const f of arr){const n=(f.p.Nombre||f.p.name||'').trim();if(!n)continue;const c=center(f);if(!c)continue;const p=project(c[0],c[1]);ctx.fillStyle='#ffffffcc';const m=ctx.measureText(n);ctx.fillRect(p.x-m.width/2-3,p.y-7,m.width+6,14);ctx.fillStyle='#233543';ctx.fillText(n,p.x,p.y)}}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#f5f7f8';ctx.fillRect(0,0,W,H);fillSet(MAP_DATA.green,'#b7df9d','#8fc878');fillSet(MAP_DATA.eco,'#8fcf86','#6bb56d');fillSet(MAP_DATA.sports,'#cfe4b1','#86ae72');fillSet(MAP_DATA.buildings,'#d9d8d2','#7d858b',1);fillSet(MAP_DATA.comedor,'#f2d4ad','#9b7145',1);lineSet(MAP_DATA.roads,'#5b6d78',2.2);
 if(routePts.length>1){ctx.strokeStyle='#ff7a00';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();routePts.forEach((p,i)=>{const q=project(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke()}
 labelSet(MAP_DATA.buildings);labelSet(MAP_DATA.comedor);labelSet(MAP_DATA.sports);
 if(user){const p=project(user.lon,user.lat);ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.fillStyle='#137bd1';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='white';ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,17,0,Math.PI*2);ctx.strokeStyle='#137bd166';ctx.lineWidth=3;ctx.stroke()}}
function hav(a,b){const R=6371000,rad=x=>x*Math.PI/180,dlat=rad(b[1]-a[1]),dlon=rad(b[0]-a[0]),p1=rad(a[1]),p2=rad(b[1]);const h=Math.sin(dlat/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const graph=new Map(),key=p=>`${p[0].toFixed(7)},${p[1].toFixed(7)}`,keyp=k=>k.split(',').map(Number);function edge(a,b){let A=key(a),B=key(b),w=hav(a,b);if(!graph.has(A))graph.set(A,[]);if(!graph.has(B))graph.set(B,[]);graph.get(A).push([B,w]);graph.get(B).push([A,w])}
for(const f of MAP_DATA.roads){if(f.g.type!=='LineString')continue;let c=f.g.coordinates;for(let i=0;i<c.length-1;i++)edge(c[i],c[i+1])}
function nearest(p){let bk=null,bd=1e99;for(const k of graph.keys()){let q=keyp(k),d=hav(p,q);if(d<bd){bd=d;bk=k}}return{key:bk,d:bd}}
function dijkstra(s,t){const D=new Map([[s,0]]),P=new Map(),Q=new Set(graph.keys());while(Q.size){let u=null,b=1e99;for(const k of Q){let d=D.get(k)??1e99;if(d<b){b=d;u=k}}if(u===null||b===1e99)return null;Q.delete(u);if(u===t)break;for(const [v,w] of graph.get(u)||[]){if(!Q.has(v))continue;let n=b+w;if(n<(D.get(v)??1e99)){D.set(v,n);P.set(v,u)}}}let path=[],u=t;while(u){path.push(u);if(u===s)break;u=P.get(u)}if(path[path.length-1]!==s)return null;path.reverse();return{path:path.map(keyp),d:D.get(t)||0}}
const destinations=new Map();function addDest(arr){for(const f of arr){let n=(f.p.Nombre||f.p.name||'').trim();if(!n||destinations.has(n))continue;let c=center(f);if(c)destinations.set(n,c)}}addDest(MAP_DATA.buildings);addDest(MAP_DATA.comedor);addDest(MAP_DATA.sports);destinations.set('Área Ecológica',center(MAP_DATA.eco[0]));destinations.set('Entrada SENATI',[-77.062488,-11.9990266]);for(const n of [...destinations.keys()].sort((a,b)=>a.localeCompare(b,'es'))){let o=document.createElement('option');o.value=n;o.textContent=n;destSel.appendChild(o)}
function routeTo(name){const dst=destinations.get(name);if(!dst)return;let a=[user.lon,user.lat],s=nearest(a),e=nearest(dst),r=s.key&&e.key?dijkstra(s.key,e.key):null;if(r){routePts=[a,...r.path,dst];status.textContent=`Ruta hacia ${name}: aprox. ${Math.round(r.d+s.d+e.d)} m.`}else{routePts=[a,dst];status.textContent=`Ruta guía hacia ${name}.`}draw()}
function setUserLocation(lat,lon,accuracy=0,demo=false){user={lat:+lat,lon:+lon,accuracy:+accuracy,demo:!!demo};routePts=[];status.textContent=demo?'Ubicación simulada lista. Elige un destino.':`Ubicación del teléfono recibida${accuracy?' (±'+Math.round(accuracy)+' m)':''}.`;draw()}
window.SenatiMap={setUserLocation,routeTo};document.getElementById('route').onclick=()=>routeTo(destSel.value);document.getElementById('loc').onclick=()=>{if(window.SenatiAndroid&&window.SenatiAndroid.requestLocation){status.textContent='Solicitando ubicación…';window.SenatiAndroid.requestLocation()}else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>setUserLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy,false),()=>status.textContent='No se pudo obtener GPS. Usa Simular ubicación.')};document.getElementById('sim').onclick=()=>{sim=!sim;document.getElementById('hint').style.display=sim?'block':'none';status.textContent=sim?'Toca cualquier punto del mapa para colocar tu ubicación.':'Simulación cancelada.'};
canvas.addEventListener('pointerdown',e=>{if(sim){const p=unproject(e.clientX,e.clientY);setUserLocation(p.lat,p.lon,0,true);sim=false;document.getElementById('hint').style.display='none';return}drag=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;ox+=e.clientX-last[0];oy+=e.clientY-last[1];last=[e.clientX,e.clientY];draw()});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();let old=scale,f=e.deltaY<0?1.15:.87;scale=Math.min(8,Math.max(.6,scale*f));let mx=e.clientX,my=e.clientY;ox=mx-(mx-ox)*(scale/old);oy=my-(my-oy)*(scale/old);draw()},{passive:false});
let pinch=null;canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)});canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=Math.min(8,Math.max(.6,scale*(d/pinch)));pinch=d;draw()}});canvas.addEventListener('touchend',()=>pinch=null);
addEventListener('resize',resize);resize();status.textContent='Mapa real de SENATI cargado · ubicación inicial simulada en la entrada.';
})();
</script>
</body></html>
