name: SENATI Map Android APK
on:
  workflow_dispatch:
  push:
    branches: [senati-map-build]
    paths:
      - 'SenatiMapMaui/**'
      - '.github/workflows/senati-map-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check Android toolchain
        run: |
          dotnet --info
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --list_installed

      - name: Validate embedded map and pedestrian network
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('SenatiMapMaui/Resources/Raw/wwwroot/index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)]
            .map(x=>x[1]).filter(x=>x.trim());
          if(scripts.length<2)throw Error('Embedded JavaScript missing');
          scripts.forEach((script,i)=>{
            try{new Function(script)}catch(err){throw Error('Embedded JS '+i+': '+err.message)}
          });
          const get=(start,end)=>{
            const i=html.indexOf(start),j=html.indexOf(end,i);
            if(i<0||j<i)throw Error('Missing '+start+' or '+end);
            return html.slice(i,j);
          };
          const mapCode=get('const MAP_DATA=',';\n').replace(/$/, ';');
          const gisCode=get('const QGIS2WEB_LAYERS = ',';\n').replace(/$/, ';');
          const graph=get('/* ---------- Red peatonal:','function smoothGps(');
          const test=new Function(
            'const CAMPUS=[-77.0631,-12.001,-77.0572,-11.9962];'+
            mapCode+gisCode+graph+
            'return {nodes:nodes.length,main:MAIN_GROUP.length,passages:QGIS_PASSAGES.length,'+
            'route:!!dijkstra(MAIN_GROUP[0],MAIN_GROUP[Math.min(80,MAIN_GROUP.length-1)])};'
          )();
          if(test.main<50||test.passages<1||!test.route)
            throw Error('Unusable navigation graph: '+JSON.stringify(test));
          console.log('JS and QGIS navigation OK:',JSON.stringify(test));
          NODE

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          dotnet publish SenatiMapMaui/SenatiMapMaui.csproj \
            -f net10.0-android -c Release \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=false \
            -p:AcceptAndroidSDKLicenses=true \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -o "$GITHUB_WORKSPACE/artifacts" \
            -v normal 2>&1 | tee artifacts/build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENATIMap-build-log
          path: artifacts/build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENATIMap-Android-APK
          path: artifacts/**/*.apk
          if-no-files-found: error
