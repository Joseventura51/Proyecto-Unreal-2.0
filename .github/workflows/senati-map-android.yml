name: SENATI Map Android APK
on:
  workflow_dispatch:
  push:
    branches: [senati-map-build]
    paths:
      - 'SenatiMapMaui/**'
      - '.github/workflows/senati-map-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Install Android SDK platforms
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build Android APK
        run: dotnet publish SenatiMapMaui/SenatiMapMaui.csproj -f net8.0-android -c Release -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false -p:AcceptAndroidSDKLicenses=true -p:AndroidSdkDirectory=$ANDROID_HOME -o "${{ github.workspace }}/artifacts"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENATIMap-Android-APK
          path: artifacts/**/*.apk
          if-no-files-found: error
