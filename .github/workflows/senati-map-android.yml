name: SENATI Map Android APK
on:
  workflow_dispatch:
  push:
    branches: [senati-map-build]
    paths:
      - 'SenatiMapMaui/**'
      - '.github/workflows/senati-map-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check Android toolchain
        run: |
          dotnet --info
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --list_installed

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          dotnet publish SenatiMapMaui/SenatiMapMaui.csproj \
            -f net8.0-android -c Release \
            -p:AndroidPackageFormats=apk \
            -p:AndroidKeyStore=false \
            -p:AcceptAndroidSDKLicenses=true \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -o "$GITHUB_WORKSPACE/artifacts" \
            -v normal 2>&1 | tee artifacts/build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENATIMap-build-log
          path: artifacts/build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SENATIMap-Android-APK
          path: artifacts/**/*.apk
          if-no-files-found: error
