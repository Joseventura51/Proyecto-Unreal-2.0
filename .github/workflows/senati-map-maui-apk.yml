name: SENATI Map MAUI APK

on:
  push:
    branches: [ senati-map-build ]
    paths:
      - 'SenatiMapMaui/**'
      - '.github/workflows/senati-map-maui-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify pinned SDK
        working-directory: SenatiMapMaui
        run: dotnet --version

      - name: Install MAUI Android workload
        working-directory: SenatiMapMaui
        run: dotnet workload install maui-android

      - name: Restore
        working-directory: SenatiMapMaui
        run: dotnet restore SenatiMapMaui.csproj

      - name: Publish standalone MAUI APK
        working-directory: SenatiMapMaui
        run: >
          dotnet publish SenatiMapMaui.csproj
          -c Release
          -f net8.0-android
          -p:AndroidPackageFormats=apk
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidEnableFastDeployment=false
          -p:RuntimeIdentifier=android-arm64
          -p:AndroidKeyStore=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SenatiMap-MAUI-Standalone
          path: SenatiMapMaui/bin/Release/net8.0-android/android-arm64/publish/*-Signed.apk
